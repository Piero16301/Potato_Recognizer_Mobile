group 'com.vladih.computer_vision.flutter_vision'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://jitpack.io'
        }
        maven {
            name 'ossrh-snapshot'
            url 'https://oss.sonatype.org/content/repositories/snapshots'
        }
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.vladih.computer_vision.flutter_vision'
    
    // Usa una versión más estable
    compileSdk 34
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    defaultConfig {
        minSdkVersion 21
        targetSdk 34  // Cambiado de 36 a 34
    }
    
    aaptOptions {
        noCompress 'tflite'
        noCompress 'lite'
    }
    
    buildFeatures {
        mlModelBinding true
    }
    
    // Añadir configuración de sourceSets
    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            resources.srcDirs = ['src/main/res']
        }
    }
    
    // Configuración para soportar 16KB page size y excluir librerías nativas problemáticas
    packagingOptions {
        // Excluir librerías nativas de OpenCV que no soportan 16KB page size
        exclude 'lib/arm64-v8a/libopencv_java3.so'
        exclude 'lib/arm64-v8a/libopencv_java4.so'
        exclude 'lib/armeabi-v7a/libopencv_java3.so'
        exclude 'lib/armeabi-v7a/libopencv_java4.so'
        exclude 'lib/x86/libopencv_java3.so'
        exclude 'lib/x86/libopencv_java4.so'
        exclude 'lib/x86_64/libopencv_java3.so'
        exclude 'lib/x86_64/libopencv_java4.so'
        
        // Alternativa: si quieres excluir todos los archivos .so de OpenCV
        // exclude '**/libopencv_*.so'
    }
}

dependencies {
    // Excluir las librerías nativas (.so) de OpenCV para evitar problemas con 16KB page size
    implementation('com.github.vladiH:opencv-android:v1.0.0') {
        exclude group: 'org.opencv', module: 'opencv-android'
        // Solo mantener las clases Java de OpenCV si es necesario
    }
    implementation 'com.google.ai.edge.litert:litert:1.4.0'
    implementation 'com.google.ai.edge.litert:litert-api:1.4.0'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.0'
    implementation 'com.google.ai.edge.litert:litert-gpu-api:1.4.0'
    implementation 'com.google.ai.edge.litert:litert-support:1.4.0'
    implementation 'com.google.ai.edge.litert:litert-metadata:1.4.0'
    
    // Configuraciones para soportar 16KB page size
    configurations.all {
        resolutionStrategy {
            // Forzar versiones compatibles si hay conflictos
            force 'com.google.ai.edge.litert:litert:1.4.0'
        }
    }
}